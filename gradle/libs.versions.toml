[versions]
slplugin = "0.2.0"
kotlin = "2.4.20"
# The plugin is compiled against this AGP API, which is the minimum AGP version it supports.
agp-api = "8.0.2"
# AGP used by the sample (testApp) and by the "latest" functional tests.
agp-latest = "9.4.1"
junit = "5.11.4"

[libraries]
android-gradle-api = { module = "com.android.tools.build:gradle-api", version.ref = "agp-api" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp-latest" }
publish = { id = "com.gradle.plugin-publish", version = "2.2.1" }
slplugin = { id = "io.github.mooner1022.slplugin", version.ref = "slplugin" }
