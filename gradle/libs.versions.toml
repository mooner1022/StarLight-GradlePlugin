[versions]
slplugin = "0.3.1"
# Same as the StarLight app (E:\AndroidStudioProjects\StarLight\gradle\libs.versions.toml).
# PluginCore is compiled with this Kotlin, so plugins need a compiler that can read its metadata.
kotlin = "2.4.20"
compileSdk = "35"
minSdk = "26"
targetSdk = "33"
buildTools = "35.0.0"
# AGP of the StarLight app, covered by the functional tests.
agp-host = "8.9.3"
# The plugin is compiled against this AGP API, which is the minimum AGP version it supports.
agp-api = "8.0.2"
# AGP used by the sample (testApp) and by the "latest" functional tests.
agp-latest = "9.4.1"
junit = "5.11.4"

[libraries]
android-gradle-api = { module = "com.android.tools.build:gradle-api", version.ref = "agp-api" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp-latest" }
publish = { id = "com.gradle.plugin-publish", version = "2.2.1" }
slplugin = { id = "io.github.mooner1022.slplugin", version.ref = "slplugin" }
